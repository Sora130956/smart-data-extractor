services:
  - type: web
    name: smart-data-extractor
    runtime: python
    plan: free
    buildCommand: "uv sync --no-dev && cd frontend && npm install && npm run build"
    startCommand: "uv run uvicorn smart_data_extractor.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Main extraction model: pydantic-ai resolves "deepseek:" prefix
      # against DEEPSEEK_API_KEY.
      - key: MODEL
        value: "deepseek:deepseek-chat"
      - key: DEEPSEEK_API_KEY
        sync: false
      # Required by Settings (config.py) but unused under the DeepSeek plan;
      # a placeholder avoids a startup ValidationError.
      - key: OPENAI_API_KEY
        value: "placeholder-not-used"
      # Optional: enables PDF/image OCR via glm-ocr (dedicated
      # layout_parsing endpoint, flat 0.2 CNY per 1M tokens; see
      # .harness/decisions.md D-031). Combine with the quota guard
      # below to cap OCR spend.
      - key: GLM_API_KEY
        sync: false
      # DEMO-STAGE quota guard (D-019): caps the daily LLM bill. Replace
      # with per-user quotas before public promotion.
      - key: DAILY_QUOTA_PER_IP
        value: "200"
      - key: DAILY_QUOTA_GLOBAL
        value: "5000"
      # Optional: set in the dashboard to enable GET /stats?token=...
      # (today's traffic report); unset hides the endpoint.
      - key: ADMIN_STATS_TOKEN
        sync: false
      # POST /feedback: delivers visitor feedback to the owner's QQ mailbox
      # via the Resend HTTP API (Render free tier blocks SMTP ports).
      # RESEND_API_KEY is the Resend API key. Sender defaults to
      # onboarding@resend.dev (override: FEEDBACK_FROM_EMAIL); recipient
      # defaults to feedback_to_email in config.py (override: FEEDBACK_TO_EMAIL).
      # Without a verified domain Resend only delivers to the Resend
      # account's own email address.
      - key: RESEND_API_KEY
        sync: false
