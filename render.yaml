services:
  - type: web
    name: smart-data-extractor
    runtime: python
    plan: free
    buildCommand: "uv sync --no-dev && cd frontend && npm install && npm run build"
    startCommand: "uv run uvicorn smart_data_extractor.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Main extraction model: pydantic-ai resolves "deepseek:" prefix
      # against DEEPSEEK_API_KEY.
      - key: MODEL
        value: "deepseek:deepseek-chat"
      - key: DEEPSEEK_API_KEY
        sync: false
      # Required by Settings (config.py) but unused under the DeepSeek plan;
      # a placeholder avoids a startup ValidationError.
      - key: OPENAI_API_KEY
        value: "placeholder-not-used"
      # Optional: enables PDF/image OCR via free glm-4v-flash.
      - key: GLM_API_KEY
        sync: false
