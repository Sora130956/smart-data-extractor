[project]
name = "smart-data-extractor"
version = "0.1.0"
description = "An LLM-powered toolkit that transforms messy, unstructured text into clean, validated, structured data."
readme = "README.md"
authors = [
    { name = "Sora", email = "1309564814@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-ai>=2.46.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
smart-data-extractor = "smart_data_extractor:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
