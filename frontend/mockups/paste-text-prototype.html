<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Data Extractor — 粘贴文本原型（F2）</title>
<style>
  :root {
    --surface: #ffffff;
    --surface-muted: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --brand: #059669;
    --accent: #0ea5e9;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --radius: 8px;
    --radius-card: 12px;
  }
  :root[data-theme="dark"] {
    --surface: #0f172a;
    --surface-muted: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --brand: #10b981;
    --accent: #38bdf8;
    --success: #34d399;
    --warning: #fbbf24;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--surface-muted);
    color: var(--text);
    font: 14px/20px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .app {
    max-width: 1080px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 28px; height: 28px; border-radius: var(--radius);
    background: var(--brand); color: #fff;
    display: grid; place-items: center; font-size: 14px; font-weight: 700;
  }
  .brand h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius); padding: 6px 12px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-muted); }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .section { padding: 20px; border-bottom: 1px solid var(--border); }
  .section-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }

  textarea {
    width: 100%; min-height: 120px; resize: vertical;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius-card); padding: 12px 14px; font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .paste-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .paste-hint { font-size: 12px; color: var(--text-muted); }
  .spacer { flex: 1; }

  .stagelist { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .stageitem {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; font-size: 13px;
  }
  .stageitem .idx {
    flex: none; width: 52px; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .stageitem .preview {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text);
  }
  .stageitem .charcount {
    flex: none; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .stageitem .remove {
    flex: none; border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px;
  }
  .stageitem .remove:hover { color: var(--error); background: var(--surface-muted); }

  .empty-hint {
    margin-top: 14px; padding: 16px; text-align: center; font-size: 12px; color: var(--text-muted);
    border: 1px dashed var(--border); border-radius: var(--radius-card);
  }

  .configbar { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  select, input[type=text] {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius); padding: 6px 10px; font-size: 13px; font-family: inherit;
  }

  .note {
    max-width: 1080px; margin: 12px auto 0; font-size: 12px; line-height: 18px; color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="brand">
      <div class="logo">SD</div>
      <h1>Smart Data Extractor</h1>
    </div>
    <button class="btn btn-sm" onclick="toggleTheme()">◐ Theme</button>
  </div>

  <div class="section">
    <div class="section-title">Paste Text</div>
    <textarea id="ta" placeholder="Paste one block of text here, e.g. one invoice, one contact card…"></textarea>

    <div class="paste-actions">
      <button class="btn btn-primary btn-sm" onclick="addSegment()">+ Add as Source</button>
      <span class="paste-hint" id="charhint">0 characters</span>
      <span class="spacer"></span>
      <span class="paste-hint">Each block you add becomes one Source → one Result</span>
    </div>

    <div id="stagelist" class="stagelist"></div>
    <div id="emptyhint" class="empty-hint">No text sources yet — paste text above and click "+ Add as Source"</div>

    <div class="configbar">
      <select><option>Mode: Preset</option><option>Mode: Custom Schema</option></select>
      <select><option>Preset: Invoice</option><option>Preset: Contact</option><option>Preset: Lead</option></select>
      <input type="text" placeholder="Extra instructions (optional)" style="width:280px" />
      <span class="spacer"></span>
      <button class="btn btn-primary" id="startbtn" disabled>Start Extraction</button>
    </div>
  </div>

</div>

<p class="note">
  原型仅用于确认「文本框 + Add 按钮 + 待处理列表」交互，非最终视觉稿。对应讨论：F2 范围收窄为纯文本流程。
</p>

<script>
  function toggleTheme() {
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
  }

  const ta = document.getElementById('ta');
  const charhint = document.getElementById('charhint');
  const stagelist = document.getElementById('stagelist');
  const emptyhint = document.getElementById('emptyhint');
  const startbtn = document.getElementById('startbtn');
  let segments = [];
  let counter = 0;

  ta.addEventListener('input', () => {
    charhint.textContent = `${ta.value.length} characters`;
  });

  function addSegment() {
    const text = ta.value.trim();
    if (!text) return;
    counter += 1;
    segments.push({ id: counter, text });
    ta.value = '';
    charhint.textContent = '0 characters';
    render();
  }

  function removeSegment(id) {
    segments = segments.filter(s => s.id !== id);
    render();
  }

  function render() {
    stagelist.innerHTML = '';
    emptyhint.style.display = segments.length ? 'none' : 'block';
    startbtn.disabled = segments.length === 0;

    segments.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'stageitem';
      const preview = s.text.replace(/\s+/g, ' ').slice(0, 80);
      row.innerHTML = `
        <span class="idx">Text ${i + 1}</span>
        <span class="preview">${preview}</span>
        <span class="charcount">${s.text.length} chars</span>
        <button class="remove" onclick="removeSegment(${s.id})">✕</button>
      `;
      stagelist.appendChild(row);
    });
  }

  render();
</script>
</body>
</html>
